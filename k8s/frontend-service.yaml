apiVersion: v1
kind: Service
metadata:
  name: pulsecity-frontend
  namespace: pulsecity
  labels:
    app.kubernetes.io/name: pulsecity
    app.kubernetes.io/component: frontend
spec:
  type: NodePort
  ports:
    - port: 80
      targetPort: 80
      nodePort: 30080
      protocol: TCP
      name: http
  selector:
    app: pulsecity-frontend
