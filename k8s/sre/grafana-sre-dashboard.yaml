apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-sre
  namespace: monitoring
  labels:
    app.kubernetes.io/name: grafana
    app.kubernetes.io/component: dashboard
data:
  pulsecity-sre-dashboard.json: |
    {
      "annotations": { "list": [] },
      "editable": true,
      "fiscalYearStartMonth": 0,
      "graphTooltip": 0,
      "id": null,
      "links": [],
      "liveNow": false,
      "panels": [
        {
          "title": "Service Availability (30m Rolling Window)",
          "type": "stat",
          "gridPos": { "h": 6, "w": 8, "x": 0, "y": 0 },
          "fieldConfig": {
            "defaults": {
              "unit": "percentunit",
              "min": 0,
              "max": 1,
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  { "color": "red", "value": null },
                  { "color": "yellow", "value": 0.98 },
                  { "color": "green", "value": 0.99 }
                ]
              }
            }
          },
          "targets": [
            {
              "expr": "avg_over_time(up{job=\"pulsecity-backend\"}[30m])",
              "legendFormat": "30m Availability SLI",
              "refId": "A"
            }
          ]
        },
        {
          "title": "HTTP Success Rate (2xx / Total)",
          "type": "stat",
          "gridPos": { "h": 6, "w": 8, "x": 8, "y": 0 },
          "fieldConfig": {
            "defaults": {
              "unit": "percentunit",
              "min": 0,
              "max": 1,
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  { "color": "red", "value": null },
                  { "color": "yellow", "value": 0.98 },
                  { "color": "green", "value": 0.99 }
                ]
              }
            }
          },
          "targets": [
            {
              "expr": "sum(rate(http_requests_total{status_code=~\"2..\"}[5m])) / sum(rate(http_requests_total[5m]))",
              "legendFormat": "HTTP Success Rate SLI",
              "refId": "A"
            }
          ]
        },
        {
          "title": "Availability vs SLO / Budget Status",
          "type": "stat",
          "gridPos": { "h": 6, "w": 8, "x": 16, "y": 0 },
          "description": "Represents current 30-minute rolling availability relative to the 99% SLO target. Note: This panel reflects instant rolling status and is NOT a cumulative monthly error-budget measurement.",
          "fieldConfig": {
            "defaults": {
              "unit": "percent",
              "min": 0,
              "max": 100,
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  { "color": "red", "value": null },
                  { "color": "yellow", "value": 25 },
                  { "color": "green", "value": 75 }
                ]
              }
            }
          },
          "targets": [
            {
              "expr": "(avg_over_time(up{job=\"pulsecity-backend\"}[30m]) - 0.99) / 0.01 * 100",
              "legendFormat": "SLO Margin (%)",
              "refId": "A"
            }
          ]
        },
        {
          "title": "HTTP 5xx Server Error Rate",
          "type": "timeseries",
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 6 },
          "fieldConfig": {
            "defaults": {
              "unit": "percentunit",
              "min": 0,
              "custom": {
                "drawStyle": "line",
                "lineInterpolation": "smooth"
              },
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  { "color": "green", "value": null },
                  { "color": "red", "value": 0.01 }
                ]
              }
            }
          },
          "targets": [
            {
              "expr": "sum(rate(http_requests_total{status_code=~\"5..\"}[5m])) / sum(rate(http_requests_total[5m]))",
              "legendFormat": "5xx Error Rate",
              "refId": "A"
            }
          ]
        },
        {
          "title": "HTTP Request Duration (p95 Latency)",
          "type": "timeseries",
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 6 },
          "fieldConfig": {
            "defaults": {
              "unit": "s",
              "custom": {
                "drawStyle": "line",
                "lineInterpolation": "smooth"
              },
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  { "color": "green", "value": null },
                  { "color": "red", "value": 0.5 }
                ]
              }
            }
          },
          "targets": [
            {
              "expr": "histogram_quantile(0.95, sum(rate(http_request_duration_seconds_bucket[5m])) by (le))",
              "legendFormat": "p95 Request Duration (seconds)",
              "refId": "A"
            }
          ]
        },
        {
          "title": "Active Concurrent Requests",
          "type": "timeseries",
          "gridPos": { "h": 8, "w": 24, "x": 0, "y": 14 },
          "fieldConfig": {
            "defaults": {
              "custom": {
                "drawStyle": "line",
                "lineInterpolation": "linear"
              }
            }
          },
          "targets": [
            {
              "expr": "http_active_requests",
              "legendFormat": "In-flight HTTP Requests",
              "refId": "A"
            }
          ]
        }
      ],
      "refresh": "10s",
      "schemaVersion": 38,
      "style": "dark",
      "tags": ["pulsecity", "sre", "slo", "prometheus"],
      "time": { "from": "now-1h", "to": "now" },
      "title": "PulseCity SRE & Reliability Dashboard",
      "uid": "pulsecity-sre-dashboard"
    }
