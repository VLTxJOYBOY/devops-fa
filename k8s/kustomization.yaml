apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: pulsecity

resources:
  - namespace.yaml
  - configmap.yaml
  - backend-deployment.yaml
  - backend-service.yaml
  - frontend-deployment.yaml
  - frontend-service.yaml

# Kustomize image transformers allow overriding <IMAGE_TAG> with immutable Git SHAs cleanly:
# e.g., kustomize edit set image ghcr.io/vltxjoyboy/pulsecity-backend=ghcr.io/vltxjoyboy/pulsecity-backend:<git-sha>
images:
  - name: ghcr.io/vltxjoyboy/pulsecity-backend
    newName: ghcr.io/vltxjoyboy/pulsecity-backend
    newTag: latest
  - name: ghcr.io/vltxjoyboy/pulsecity-frontend
    newName: ghcr.io/vltxjoyboy/pulsecity-frontend
    newTag: latest
