apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-pulsecity
  namespace: monitoring
  labels:
    app.kubernetes.io/name: grafana
data:
  pulsecity-dashboard.json: |
    {
      "annotations": { "list": [] },
      "editable": true,
      "fiscalYearStartMonth": 0,
      "graphTooltip": 0,
      "id": null,
      "links": [],
      "liveNow": false,
      "panels": [
        {
          "title": "Backend Availability / Health",
          "type": "stat",
          "gridPos": { "h": 4, "w": 8, "x": 0, "y": 0 },
          "targets": [
            {
              "expr": "up{job=\"pulsecity-backend\"}",
              "legendFormat": "Service Health (1=UP, 0=DOWN)",
              "refId": "A"
            }
          ]
        },
        {
          "title": "Active Concurrent Requests",
          "type": "stat",
          "gridPos": { "h": 4, "w": 8, "x": 8, "y": 0 },
          "targets": [
            {
              "expr": "http_active_requests",
              "legendFormat": "Active Requests",
              "refId": "A"
            }
          ]
        },
        {
          "title": "Node.js Heap Memory Usage",
          "type": "timeseries",
          "gridPos": { "h": 4, "w": 8, "x": 16, "y": 0 },
          "targets": [
            {
              "expr": "nodejs_heap_size_used_bytes",
              "legendFormat": "Heap Memory (Bytes)",
              "refId": "A"
            }
          ]
        },
        {
          "title": "HTTP Request Rate (req/sec)",
          "type": "timeseries",
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 4 },
          "targets": [
            {
              "expr": "sum(rate(http_requests_total[5m]))",
              "legendFormat": "Total Request Rate",
              "refId": "A"
            }
          ]
        },
        {
          "title": "HTTP Status / Error Breakdown",
          "type": "timeseries",
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 4 },
          "targets": [
            {
              "expr": "sum(rate(http_requests_total[5m])) by (status_code)",
              "legendFormat": "Status {{status_code}}",
              "refId": "A"
            }
          ]
        },
        {
          "title": "HTTP Request Duration (p95 Latency)",
          "type": "timeseries",
          "gridPos": { "h": 8, "w": 24, "x": 0, "y": 12 },
          "targets": [
            {
              "expr": "histogram_quantile(0.95, sum(rate(http_request_duration_seconds_bucket[5m])) by (le))",
              "legendFormat": "p95 Latency (s)",
              "refId": "A"
            }
          ]
        }
      ],
      "refresh": "10s",
      "schemaVersion": 38,
      "style": "dark",
      "tags": ["pulsecity", "prometheus", "backend"],
      "time": { "from": "now-30m", "to": "now" },
      "title": "PulseCity Observability Dashboard",
      "uid": "pulsecity-observability"
    }
