<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="/pixora-logo.svg" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Pixora is a modern photography platform to discover stunning visual art, curate personal collections, and share high-resolution photographs with a global creative community." />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=Playfair+Display:ital,wght@0,500;0,700;1,400&display=swap" rel="stylesheet">
  <title>📸 Pixora — Discover Visual Art</title>

  <!-- Creative Animated Browser Title Controller -->
  <script>
    (function () {
      const creativeTitles = [
        "📸 Pixora — Discover Visual Art",
        "✨ Pixora — Curated Collections",
        "🎨 Pixora — Photographic Inspiration",
        "✦ Pixora — Explore Extraordinary Shots",
        "📷 Pixora — High-Res Creator Community"
      ];

      let currentIndex = 0;
      let intervalId = null;

      function startAnimation() {
        if (intervalId) clearInterval(intervalId);
        intervalId = setInterval(() => {
          currentIndex = (currentIndex + 1) % creativeTitles.length;
          document.title = creativeTitles[currentIndex];
        }, 2800);
      }

      function stopAnimation() {
        if (intervalId) {
          clearInterval(intervalId);
          intervalId = null;
        }
      }

      // Handle visibility changes when the user switches tabs
      document.addEventListener("visibilitychange", function () {
        if (document.hidden) {
          stopAnimation();
          document.title = "✨ Don't miss the shot! • Pixora";
        } else {
          document.title = "📸 Welcome back to Pixora!";
          setTimeout(() => {
            document.title = creativeTitles[currentIndex];
            startAnimation();
          }, 1500);
        }
      });

      startAnimation();
    })();
  </script>
</head>

<body>
  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>
</body>

</html>
